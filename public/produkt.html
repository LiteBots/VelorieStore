<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Produkt — Velorie Store</title>
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" href="https://i.imgur.com/NDhlWyz.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
<div class="site">
  <div id="vs-header"></div>
  <main class="container" style="padding-top:32px" id="root">
    <div class="product-layout"><div class="skeleton" style="aspect-ratio:16/9"></div><div class="skeleton" style="height:520px"></div></div>
  </main>
  <div id="vs-footer"></div>
</div>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/app.js"></script>
<script>
  VS.layout({ active: 'Sklep' });
  const { esc, fmt, icon } = VS;
  const slug = decodeURIComponent((location.pathname.match(/^\/produkt\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get('slug') || '');
  let data, tab = location.hash === '#recenzje' ? 'reviews' : 'desc', img = 0, reviews = null;

  async function load() {
    try { data = await VS.api('/api/products/' + encodeURIComponent(slug)); }
    catch {
      document.getElementById('root').innerHTML = `<div class="card empty" style="margin:40px auto;max-width:520px"><span class="icon-box lg">${icon('package', 'i-lg')}</span>
        <h3>Nie znaleziono produktu</h3><p>Produkt mógł zostać usunięty lub ukryty przez twórcę.</p><a href="/sklep.html" class="btn btn-primary mt-6">Wróć do sklepu</a></div>`;
      return;
    }
    render();
  }

  function buyBox(p) {
    const { owned, is_owner } = data;
    if (owned) return `
      <a href="/api/products/${p.id}/download" class="btn btn-primary btn-lg btn-block">${icon('download', 'i-md')}Pobierz v${esc(p.version)}</a>
      <a href="/panel.html#/account/library" class="btn btn-secondary btn-lg btn-block mt-2">${icon('key', 'i-md')}Klucz licencji</a>
      <div class="callout callout-green mt-4 small">${icon('check-circle', 'i-md')}<span>Masz ten produkt w swojej bibliotece.</span></div>`;
    if (is_owner) return `
      <a href="/panel.html#/seller/products/${p.id}" class="btn btn-primary btn-lg btn-block">${icon('pencil', 'i-md')}Edytuj produkt</a>
      <div class="callout mt-4 small">${icon('info', 'i-md')}<span>To Twój produkt${p.status !== 'published' ? ' — obecnie <b>niepublikowany</b>' : ''}.</span></div>`;
    const inCart = VS.cart.has(p.id);
    return `
      <button id="buy-now" class="btn btn-primary btn-lg btn-block">${p.price ? 'Kup teraz' : 'Odbierz za darmo'}</button>
      <div class="row gap-2 mt-2">
        <button id="add-cart" class="btn btn-secondary btn-lg grow">${icon(inCart ? 'check' : 'cart', 'i-md')}${inCart ? 'W koszyku' : 'Dodaj do koszyka'}</button>
        <button id="wish" class="btn btn-secondary btn-lg btn-icon" aria-label="Lista życzeń" title="Lista życzeń" style="${data.wishlisted ? 'color:var(--brand)' : ''}">${icon('heart', 'i-md' + (data.wishlisted ? ' i-fill' : ''))}</button>
      </div>`;
  }

  function render() {
    const { product: p, seller, versions, related, rating_distribution: dist } = data;
    document.title = `${p.title} — Velorie Store`;
    const images = [p.cover_url, ...(p.gallery || [])].filter(Boolean);
    const total = p.reviews_count || 0;

    document.getElementById('root').innerHTML = `
      <div class="crumbs mb-6"><a href="/">Start</a><i data-i="chevron-right"></i><a href="/sklep.html">Sklep</a><i data-i="chevron-right"></i>
        <a href="/sklep.html?category=${p.category}">${esc(VS.CAT_NAMES[p.category] || p.category)}</a><i data-i="chevron-right"></i><span class="truncate" style="color:var(--text-2)">${esc(p.title)}</span></div>

      <div class="product-layout">
          <div class="pl-gallery">
            <div class="gallery-main">${images[img] ? `<img src="${esc(images[img])}" alt="${esc(p.title)}">` : ''}</div>
            ${images.length > 1 ? `<div class="gallery-thumbs">${images.map((src, i) => `<button data-img="${i}" class="${i === img ? 'on' : ''}" aria-label="Zdjęcie ${i + 1}"><img src="${esc(src)}" alt=""></button>`).join('')}</div>` : ''}
          </div>

          <div class="pl-tabs">
            <div class="tabs" role="tablist">
              <button class="tab ${tab === 'desc' ? 'on' : ''}" data-tab="desc">Opis</button>
              <button class="tab ${tab === 'updates' ? 'on' : ''}" data-tab="updates">Aktualizacje<span class="count">${versions.length}</span></button>
              <button class="tab ${tab === 'reviews' ? 'on' : ''}" data-tab="reviews">Recenzje<span class="count">${total}</span></button>
            </div>
            <div class="mt-6" id="tab-body"></div>
          </div>

        <aside class="buybox stack">
          <div class="card card-pad">
            <div class="row gap-2 wrap">
              <span class="badge">${icon(VS.catIcon(p.category), 'i-xs')}${esc(VS.CAT_NAMES[p.category] || p.category)}</span>
              ${p.featured ? `<span class="badge badge-brand">${icon('flame', 'i-xs')}Polecane</span>` : ''}
            </div>
            <h1 class="h3 mt-4" style="font-size:24px;letter-spacing:-.025em">${esc(p.title)}</h1>
            <p class="muted small mt-2">${esc(p.summary)}</p>
            <div class="row gap-3 mt-4 small">
              ${p.rating ? `<a href="#recenzje" data-goto="reviews" class="row gap-2">${VS.stars(p.rating)}<span class="strong num">${Number(p.rating).toFixed(1)}</span><span class="subtle">(${total})</span></a>` : '<span class="subtle">Brak ocen</span>'}
              <span class="faint">·</span><span class="subtle num">${fmt.num(p.sales)} ${fmt.plural(p.sales, 'sprzedaż', 'sprzedaże', 'sprzedaży')}</span>
            </div>
            <div class="divider mt-6 mb-6"></div>
            <div class="price-big ${p.price ? '' : 'c-green'}">${fmt.price(p.price)}</div>
            <div class="xs subtle mt-1">${p.price ? 'Płatność jednorazowa · bez subskrypcji' : 'Bez opłat'}</div>
            <div class="mt-6">${buyBox(p)}</div>
            <ul class="trust mt-6">
              <li>${icon('zap', 'i-md')}Natychmiastowy dostęp po płatności</li>
              <li>${icon('refresh', 'i-md')}Darmowe aktualizacje</li>
              <li>${icon('key', 'i-md')}${p.license_enabled ? `Licencja na ${p.max_activations ? `${p.max_activations} ${fmt.plural(p.max_activations, 'serwer', 'serwery', 'serwerów')}` : 'dowolną liczbę serwerów'}` : 'Bez klucza licencji'}</li>
            </ul>
          </div>

          <div class="card card-pad-sm" style="padding:6px 20px">
            <dl class="spec">
              <div style="border-top:0"><dt>Wersja</dt><dd class="mono">v${esc(p.version)}</dd></div>
              <div style="border-top:0"><dt>Aktualizacja</dt><dd>${fmt.date(p.updated_at)}</dd></div>
              <div><dt>Rozmiar</dt><dd>${p.has_file ? fmt.size(p.file_size) : '—'}</dd></div>
              <div><dt>Wydano</dt><dd>${fmt.date(p.created_at)}</dd></div>
              <div style="grid-column:1/-1"><dt>Kompatybilność</dt><dd>${esc(p.compatibility || '—')}</dd></div>
            </dl>
          </div>

          <a href="/tworca/${esc(seller.store_slug)}" class="card card-pad-sm card-hover seller-card" style="padding:16px 18px">
            ${VS.avatar(seller, 'avatar-lg avatar-sq')}
            <div class="grow"><div class="row gap-2 strong">${esc(seller.store_name)}${icon('check-circle', 'i-sm verified')}</div>
              <div class="xs subtle">${seller.products} ${fmt.plural(seller.products, 'produkt', 'produkty', 'produktów')} · ${fmt.num(seller.sales)} sprzedaży</div></div>
            ${icon('chevron-right', 'i-md subtle')}
          </a>
        </aside>
      </div>

      ${related.length ? `<section class="section-sm" style="padding-bottom:0"><div class="section-head"><h2 class="h3">Może Cię zainteresować</h2>
        <a href="/sklep.html?category=${p.category}" class="link-brand small">Więcej z kategorii</a></div>
        <div class="grid g-4">${related.map(VS.productCard).join('')}</div></section>` : ''}`;

    VS.icons();
    renderTab();
    document.querySelectorAll('[data-img]').forEach((b) => b.onclick = () => { img = Number(b.dataset.img); render(); });
    document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b)); renderTab(); });
    document.querySelectorAll('[data-goto]').forEach((a) => a.onclick = (e) => { e.preventDefault(); tab = 'reviews'; render(); document.querySelector('.tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

    const item = { id: p.id, title: p.title, price: p.price, cover_url: p.cover_url, slug: p.slug, store_name: p.store_name };
    const buy = document.getElementById('buy-now');
    if (buy) buy.onclick = () => { VS.cart.add(item, true); location.href = '/koszyk.html'; };
    const add = document.getElementById('add-cart');
    if (add) add.onclick = () => { if (VS.cart.has(p.id)) location.href = '/koszyk.html'; else { VS.cart.add(item); render(); } };
    const wish = document.getElementById('wish');
    if (wish) wish.onclick = async () => {
      if (!VS.me) return (location.href = '/auth.html?next=' + encodeURIComponent(location.pathname));
      const r = await VS.api('/api/me/wishlist/' + p.id, { method: data.wishlisted ? 'DELETE' : 'POST' });
      data.wishlisted = r.wishlisted;
      VS.toast(r.wishlisted ? 'Zapisano na liście życzeń' : 'Usunięto z listy życzeń', 'ok');
      render();
    };
    VS.reveal();
  }

  async function renderTab() {
    const el = document.getElementById('tab-body');
    const p = data.product;
    if (tab === 'desc') {
      el.innerHTML = `<div class="prose">${VS.md(p.description) || '<p>Twórca nie dodał jeszcze opisu.</p>'}</div>
        ${p.tags.length ? `<div class="row wrap gap-2 mt-8">${p.tags.map((t) => `<a href="/sklep.html?q=${encodeURIComponent(t)}" class="chip">${icon('tag', 'i-xs')}${esc(t)}</a>`).join('')}</div>` : ''}`;
    } else if (tab === 'updates') {
      el.innerHTML = data.versions.length ? `<div class="timeline">${data.versions.map((v, i) => `
        <div class="timeline-item ${i ? '' : 'latest'}">
          <div class="row gap-3 wrap"><span class="strong mono">v${esc(v.version)}</span>${i ? '' : '<span class="badge badge-brand">Najnowsza</span>'}<span class="xs subtle">${fmt.date(v.created_at)}</span></div>
          <div class="prose small mt-2">${VS.md(v.changelog) || '<p>Brak opisu zmian.</p>'}</div>
        </div>`).join('')}</div>` : '<p class="muted">Brak historii wersji.</p>';
    } else {
      const total = p.reviews_count || 0;
      const dist = data.rating_distribution;
      el.innerHTML = `
        <div class="card card-pad"><div class="grid" style="grid-template-columns:auto 1fr;gap:40px;align-items:center">
          <div class="text-center"><div class="price-big">${p.rating ? Number(p.rating).toFixed(1) : '–'}</div><div class="mt-2">${VS.stars(p.rating)}</div><div class="xs subtle mt-2">${total} ${fmt.plural(total, 'ocena', 'oceny', 'ocen')}</div></div>
          <div class="rating-bars">${[5, 4, 3, 2, 1].map((s) => { const n = dist[s] || 0; return `<div class="rating-bar"><span>${s}</span><div class="track"><div class="fill" style="width:${total ? (n / total) * 100 : 0}%"></div></div><span class="text-right">${n}</span></div>`; }).join('')}</div>
        </div></div>
        ${data.owned ? `<form id="review-form" class="card card-pad mt-4">
          <div class="h4">${data.my_review ? 'Twoja recenzja' : 'Oceń produkt'}</div>
          <div class="star-input mt-3" id="rate">${[1, 2, 3, 4, 5].map((s) => `<button type="button" data-rate="${s}" aria-label="${s} / 5">${icon('star')}</button>`).join('')}</div>
          <textarea id="review-text" class="textarea mt-4" rows="3" placeholder="Jak działa produkt? Co warto wiedzieć przed zakupem?">${esc(data.my_review ? data.my_review.comment : '')}</textarea>
          <div class="row end mt-4"><button class="btn btn-primary">Opublikuj recenzję</button></div></form>` : ''}
        <div id="reviews-list" class="mt-4"><div class="skeleton" style="height:90px"></div></div>`;
      const form = document.getElementById('review-form');
      if (form) {
        let rating = data.my_review ? data.my_review.rating : 5;
        const paint = () => form.querySelectorAll('[data-rate]').forEach((b, i) => b.classList.toggle('on', i < rating));
        form.querySelectorAll('[data-rate]').forEach((b) => b.onclick = () => { rating = Number(b.dataset.rate); paint(); });
        paint();
        form.onsubmit = async (e) => {
          e.preventDefault();
          try {
            await VS.api(`/api/products/${p.id}/reviews`, { method: 'POST', body: { rating, comment: document.getElementById('review-text').value } });
            VS.toast('Dziękujemy za recenzję!', 'ok');
            data = await VS.api('/api/products/' + encodeURIComponent(slug)); reviews = null; render();
          } catch (err) { VS.toast(err.message, 'err'); }
        };
      }
      reviews ??= await VS.api(`/api/products/${p.id}/reviews`);
      document.getElementById('reviews-list').innerHTML = reviews.length ? reviews.map((r) => `
        <div class="review">
          <div class="row gap-3">${VS.avatar(r)}
            <div class="grow"><div class="row gap-2 wrap"><span class="strong small">${esc(r.username)}</span><span class="badge badge-green" style="height:20px">${icon('check', 'i-xs')}Zakup zweryfikowany</span></div>
              <div class="row gap-2 mt-1">${VS.stars(r.rating, 'i-xs')}<span class="xs subtle">${fmt.rel(r.created_at)}</span></div></div></div>
          ${r.comment ? `<p class="muted mt-3" style="font-size:14px">${esc(r.comment)}</p>` : ''}
        </div>`).join('') : '<div class="empty"><p>Brak recenzji. Opinie mogą wystawiać tylko osoby, które kupiły produkt.</p></div>';
    }
    VS.icons(el);
  }

  VS.meReady.then(load);
</script>
</body>
</html>
