<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Twórca — Velorie Store</title>
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" href="https://i.imgur.com/NDhlWyz.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <style>
    .cover-band { height: 220px; border-radius: var(--r-2xl); border: 1px solid var(--line); overflow: hidden; position: relative; background: var(--surface); }
    .cover-band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(28px) saturate(140%); transform: scale(1.3); opacity: .55; }
    .cover-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(7, 8, 13, .6)); }
    .profile { display: flex; align-items: flex-end; gap: 24px; margin-top: -56px; padding: 0 28px; position: relative; z-index: 1; flex-wrap: wrap; }
    .profile .avatar-xl { border: 4px solid var(--bg); box-shadow: var(--shadow); }
    .stat-row { display: flex; gap: 32px; flex-wrap: wrap; }
    .stat-row b { display: block; font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stat-row span { font-size: 13px; color: var(--text-3); }
    @media (max-width: 640px) { .profile { padding: 0 12px; } .cover-band { height: 150px; } }
  </style>
</head>
<body>
<div class="site">
  <div id="vs-header"></div>
  <main class="container" style="padding-top:32px" id="root"><div class="skeleton" style="height:320px"></div></main>
  <div id="vs-footer"></div>
</div>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/app.js"></script>
<script>
  VS.layout({});
  const { esc, fmt, icon } = VS;
  const slug = decodeURIComponent((location.pathname.match(/^\/tworca\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get('slug') || '');
  VS.api('/api/sellers/' + encodeURIComponent(slug)).then(({ seller: s, stats, products }) => {
    document.title = `${s.store_name} — Velorie Store`;
    const cats = [...new Set(products.map((p) => VS.CAT_NAMES[p.category]))];
    document.getElementById('root').innerHTML = `
      <div class="cover-band">${products[0] ? `<img src="${esc(products[0].cover_url)}" alt="">` : ''}</div>
      <div class="profile">
        ${VS.avatar(s, 'avatar-xl')}
        <div class="grow" style="padding-bottom:6px">
          <div class="row gap-2"><h1 class="h2">${esc(s.store_name)}</h1>${icon('check-circle', 'i-lg verified')}</div>
          <div class="row gap-3 wrap small subtle mt-2"><span>Na Velorie od ${fmt.date(s.created_at)}</span>${s.discord_username ? `<span class="row gap-1">${icon('discord', 'i-sm')}${esc(s.discord_username)}</span>` : ''}${cats.length ? `<span>${esc(cats.slice(0, 3).join(' · '))}</span>` : ''}</div>
        </div>
        <div class="row gap-2" style="padding-bottom:6px">
          <button class="btn btn-secondary" id="share">${icon('copy', 'i-md')}Kopiuj link</button>
        </div>
      </div>

      <div class="grid mt-10" style="grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start" id="cols">
        <section>
          <div class="section-head" style="margin-bottom:20px"><h2 class="h3">Produkty <span class="subtle" style="font-weight:500">${products.length}</span></h2></div>
          <div class="grid g-3">${products.map(VS.productCard).join('') || '<p class="muted">Ten twórca nie ma jeszcze produktów.</p>'}</div>
        </section>
        <aside class="stack">
          <div class="card card-pad">
            <div class="h4">O twórcy</div>
            <p class="muted small mt-3" style="line-height:1.7">${esc(s.bio || 'Twórca zasobów w Velorie Store.')}</p>
            <div class="divider mt-6 mb-6"></div>
            <div class="stat-row">
              <div><b>${stats.products}</b><span>produktów</span></div>
              <div><b>${fmt.num(stats.sales)}</b><span>sprzedaży</span></div>
              <div><b>${stats.rating ? Number(stats.rating).toFixed(1) : '–'}</b><span>${stats.reviews} ocen</span></div>
            </div>
          </div>
          <div class="card card-pad">
            <ul class="trust">
              <li>${icon('check-circle', 'i-md')}Zweryfikowany twórca Velorie</li>
              <li>${icon('key', 'i-md')}Produkty chronione licencją</li>
              <li>${icon('refresh', 'i-md')}Aktualizacje w cenie</li>
            </ul>
          </div>
        </aside>
      </div>`;
    if (innerWidth < 1000) document.getElementById('cols').style.gridTemplateColumns = '1fr';
    document.getElementById('share').onclick = () => VS.copy(location.href, 'Skopiowano link do profilu');
    VS.reveal();
  }).catch(() => {
    document.getElementById('root').innerHTML = `<div class="card empty" style="max-width:520px;margin:40px auto"><span class="icon-box lg">${icon('store', 'i-lg')}</span><h3>Nie znaleziono twórcy</h3><p>Profil mógł zostać usunięty.</p><a href="/sklep.html" class="btn btn-primary mt-6">Wróć do sklepu</a></div>`;
  });
</script>
</body>
</html>
