<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Panel – Velorie Store</title>
  <meta name="theme-color" content="#0a1030" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="https://i.imgur.com/NDhlWyz.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/assets/css/velorie.css" />
</head>
<body class="min-h-screen">
  <div id="vs-header"></div>
  <div class="relative z-10 mx-auto max-w-[1400px] px-4 py-6 grid lg:grid-cols-[250px_1fr] gap-6 items-start">
    <aside class="lg:sticky lg:top-24">
      <button id="side-toggle" class="lg:hidden w-full mb-3 inline-flex items-center justify-between rounded-2xl btn-ghost px-4 py-3 text-sm font-semibold">
        <span class="inline-flex items-center gap-2"><i data-lucide="panel-left" class="h-4 w-4"></i><span id="side-current">Menu panelu</span></span><i data-lucide="chevron-down" class="h-4 w-4"></i>
      </button>
      <nav id="side" class="hidden lg:block glass rounded-3xl p-3 max-h-[calc(100dvh-120px)] overflow-y-auto"></nav>
    </aside>
    <main id="view" class="min-w-0"><div class="skeleton h-96"></div></main>
  </div>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/panel.js"></script>
  <script src="/assets/js/panel-seller.js"></script>
  <script src="/assets/js/panel-admin.js"></script>
</body>
</html>
